<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container for display -->
  <rect width="100%" height="100%" fill="#0A0B10" rx="16" />

  <!-- Logo Mark -->
  <g transform="translate(20, 20)">
    <!-- Outer Hex/Diamond -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#cyanGrad)" filter="url(#neonGlow)" />
    <rect x="4" y="4" width="72" height="72" rx="16" fill="#0A0B10" />
    
    <!-- Inner Wrench & Lightning Bolt Symbol -->
    <path d="M 46 16 L 24 46 L 38 46 L 30 68 L 56 36 L 40 36 Z" fill="url(#cyanGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(120, 48)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="38" letter-spacing="-1.5" fill="#FFFFFF">
      GOVOLT
    </text>
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4" fill="#22d3ee" y="24" x="2">
      MECHANIC
    </text>
  </g>

  <!-- Tagline Badge -->
  <g transform="translate(350, 42)">
    <rect width="125" height="30" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="62.5" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#22d3ee" text-anchor="middle" letter-spacing="1">
      EV REPAIR
    </text>
  </g>
</svg>
